name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Generated files match the source
        run: git diff --exit-code -- custom_components/deepal_companion ':(exclude)*.gz'
      - name: Frontend revision matches const.py
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('custom_components/deepal_companion')
          revision = re.search(r'FRONTEND_REVISION = "([^"]+)"', (root / 'const.py').read_text(encoding='utf-8')).group(1)
          stale = sorted({f"{path.name}: {found}" for path in [*(root / 'frontend').rglob('*.js'), *(root / 'frontend').rglob('*.css')]
                          for found in re.findall(r'rev=(\d{8}-\d+)', path.read_text(encoding='utf-8')) if found != revision})
          if stale:
              sys.exit('Frontend files with a different revision than const.py (' + revision + '):\n' + '\n'.join(stale))
          PY
      - run: npm run test:curve
      - run: npm run test:tokens
      - run: npm run test:language
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:plan
      - run: npm run test:neon
      - run: npm run test:turn
      - run: npm run test:range
      - run: npm run test:nfpopup
      - run: npm run test:ensheet
      - run: npm run test:browser
      - run: npm run test:browser
        env:
          MEMORY_ONLY: '1'
      - run: npm run test:browser
        env:
          LANG_ONLY: '1'
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
