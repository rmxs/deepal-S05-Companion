name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      # Run before the build: it reads the checked-out (committed) files, so a committed .gz that no longer matches
      # its .js is caught. Home Assistant serves the .gz when present, so a stale one would reach users.
      - name: Every .gz matches its .js
        run: |
          python - <<'PY'
          import gzip, pathlib, sys
          root = pathlib.Path('custom_components/deepal_companion/frontend')
          bad = []
          for js in sorted(root.rglob('*.js')):
              gz = js.with_suffix('.js.gz')
              if not gz.exists():
                  bad.append(f'{js}: no .gz next to it')
              elif gzip.decompress(gz.read_bytes()) != js.read_bytes():
                  bad.append(f'{js}: .gz differs from the .js')
          for gz in sorted(root.rglob('*.js.gz')):
              if not gz.with_suffix('').exists():
                  bad.append(f'{gz}: no .js next to it')
          if bad:
              sys.exit('Compressed copies out of date:\n' + '\n'.join(bad))
          print('every .gz matches its .js')
          PY
      - run: npm run build
      - name: Generated files match the source
        run: git diff --exit-code -- custom_components/deepal_companion ':(exclude)*.gz'
      - name: Frontend revision matches const.py
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('custom_components/deepal_companion')
          revision = re.search(r'FRONTEND_REVISION = "([^"]+)"', (root / 'const.py').read_text(encoding='utf-8')).group(1)
          stale = sorted({f"{path.name}: {found}" for path in [*(root / 'frontend').rglob('*.js'), *(root / 'frontend').rglob('*.css')]
                          for found in re.findall(r'rev=(\d{8}-\d+)', path.read_text(encoding='utf-8')) if found != revision})
          if stale:
              sys.exit('Frontend files with a different revision than const.py (' + revision + '):\n' + '\n'.join(stale))
          PY
      - run: npm run test:curve
      - run: npm run test:tokens
      - run: npm run test:language
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:plan
      - run: npm run test:neon
      - run: npm run test:turn
      - run: npm run test:range
      - run: npm run test:nfpopup
      - run: npm run test:ensheet
      - run: npm run test:browser
      - run: npm run test:browser
        env:
          MEMORY_ONLY: '1'
      - run: npm run test:browser
        env:
          LANG_ONLY: '1'
      - name: Frontend checks that need no browser
        run: |
          node tests/test_advanced_conditions.cjs
          node tests/test_session_strings_translated.cjs
      - name: Frontend pages that start their own browser
        run: |
          node tests/test_charge_plan_full.cjs
          node tests/test_notification_colours.cjs
          node tests/test_pending_button.cjs
      - name: Open settings sections (SECTIONS_ONLY)
        run: npm run test:browser
        env:
          SECTIONS_ONLY: '1'
      - name: Notification features (NOTIFY_FEATURES_ONLY)
        run: npm run test:browser
        env:
          NOTIFY_FEATURES_ONLY: '1'
      - name: Preconditioning page and notification link (PRECOND_NOTIFY_LINK_ONLY)
        run: npm run test:browser
        env:
          PRECOND_NOTIFY_LINK_ONLY: '1'
      - name: Preconditioning page layout (PRECOND_UI_ONLY, also covers seg_parity)
        run: npm run test:browser
        env:
          PRECOND_UI_ONLY: '1'
      - name: Stale last update (STALE_ONLY)
        run: npm run test:browser
        env:
          STALE_ONLY: '1'
      - name: Charge target (CHARGE_TARGET_ONLY)
        run: npm run test:browser
        env:
          CHARGE_TARGET_ONLY: '1'
      - name: Recommended notifications (NOTIFY_RECOMMENDED_ONLY)
        run: npm run test:browser
        env:
          NOTIFY_RECOMMENDED_ONLY: '1'
      - name: Energy cost regressions (ENERGY_COST_ONLY)
        run: npm run test:browser
        env:
          ENERGY_COST_ONLY: '1'
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
