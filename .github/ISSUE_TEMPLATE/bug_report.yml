name: Bug report
description: Report a reproducible Companion problem
body:
  - type: input
    id: versions
    attributes:
      label: Home Assistant and Companion versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result, and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, vehicle identifiers, locations and personal data.
      render: text
